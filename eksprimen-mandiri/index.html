
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum DOM</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1 id="judul">Latihan DOM</h1>
    <p id="pesan">Belum ada tindakan</p>
    <button id="tombolAksi" type="button">Klik Saya</button>

    <!-- Mengubah kelas dan gaya CSS -->
    <p id="teksGaya">Teks ini dapat diubah gayanya.</p>
    <button id="tombolGaya" type="button">Ubah Gaya</button>

    <!-- Event input dan penghitung karakter -->
    <label for="namaInput">Nama</label>
    <input type="text" id="namaInput" maxlength="40">
    <p>Jumlah Karakter: <span id="jumlahKarakter">0</span></p>

    <!-- Validasi form pendaftaran -->
    <form id="formPendaftaran" novalidate>
        <label for="nama">Nama lengkap</label>
        <input id="nama" name="nama" type="text">
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <label for="usia">Usia</label>
        <input id="usia" name="usia" type="number" min="17" max="100">
        <button type="submit">Daftar</button>
        <p id="pesanForm" aria-live="polite"></p>
    </form>

    <section>
        <h2>Daftar Tugas</h2>
        <label for="inputTugas">Tugas baru</label>
        <input id="inputTugas" type="text">
        <button id="tambahTugas" type="button">Tambah</button>
        <p id="pesanTugas" aria-live="polite"></p>
        <ul id="daftarTugas"></ul>
    </section>

    <!-- Eksperimen 3: Dropdown sesi workshop -->
    <section>
        <h2>Pilihan Sesi Workshop</h2>
        <label for="sesi">Pilih sesi</label>
        <select id="sesi">
            <option value="">-- Pilih sesi --</option>
            <option value="HTML dan CSS">HTML dan CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="UI/UX Design">UI/UX Design</option>
        </select>
        <p id="pesanSesi">Belum ada sesi yang dipilih.</p>
    </section>

    <!-- Eksperimen 4: Sembunyikan dan tampilkan paragraf -->
    <section>
        <h2>Sembunyikan dan Tampilkan Paragraf</h2>
        <p id="paragraf">Ini adalah paragraf yang bisa disembunyikan dan ditampilkan kembali.</p>
        <button id="tombolTampil" type="button">Sembunyikan</button>
    </section>
</body>
</html>
